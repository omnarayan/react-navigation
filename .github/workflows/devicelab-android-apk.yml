name: Devicelab Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches:
      - devicelab-build-57d79ba
    paths:
      - .github/workflows/devicelab-android-apk.yml

env:
  JAVA_DISTRIBUTION: 'zulu'
  JAVA_VERSION: '17'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_USER_HOME: /home/runner/.android
  API_LEVEL: 34

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    env:
      ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup
        uses: ./.github/actions/setup

      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793
        with:
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build Android App
        run: |
          pnpm expo prebuild --platform android
          cd android
          ./gradlew assembleDebug -DtestBuildType=debug -Dorg.gradle.jvmargs=-Xmx4g
        working-directory: example

      - name: Prepare output folder
        run: |
          mkdir android-debug-build
          mv example/android/app/build/outputs/apk/debug/app-debug.apk android-debug-build/android-debug.apk

      - name: Upload debug build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-debug-${{ matrix.arch }}
          path: android-debug-build/android-debug.apk
          if-no-files-found: error
          retention-days: 7
